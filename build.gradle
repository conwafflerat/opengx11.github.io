import org.gradle.internal.os.OperatingSystem

plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.3'
    lwjglNatives = resolveNatives()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
}

application {
    mainClass = 'com.sonic1.Main'
    // GLFW must own the main thread on macOS.
    applicationDefaultJvmArgs = ['-XstartOnFirstThread'].findAll {
        OperatingSystem.current() == OperatingSystem.MAC_OS
    }
}

// Pick the right native classifier for the host OS / CPU so the same build
// works on Windows, Linux, Intel Mac and Apple Silicon.
static String resolveNatives() {
    def os = OperatingSystem.current()
    def arch = System.getProperty('os.arch')
    if (os == OperatingSystem.WINDOWS) {
        return arch.contains('64')
            ? (arch.startsWith('aarch64') ? 'natives-windows-arm64' : 'natives-windows')
            : 'natives-windows-x86'
    }
    if (os == OperatingSystem.MAC_OS) {
        return arch.startsWith('aarch64') ? 'natives-macos-arm64' : 'natives-macos'
    }
    // Linux / *nix
    if (arch.startsWith('aarch64')) return 'natives-linux-arm64'
    if (arch.startsWith('arm'))     return 'natives-linux-arm32'
    return 'natives-linux'
}
